__build_info:
  rime_version: 1.17.0
  timestamps:
    default: 1784198043
    default.custom: 0
    weike_pinyin.custom: 0
    weike_pinyin.schema: 1784550723
emoji:
  inherit_comment: false
  opencc_config: emoji.json
  option_name: emoji
engine:
  filters:
    - "simplifier@emoji"
    - uniquifier
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
    - "table_translator@melt_eng"
melt_eng:
  dictionary: melt_eng
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 0.95
menu:
  page_size: 9
schema:
  name: "维刻拼音"
  schema_id: weike_pinyin
  version: 2026.07.07
speller:
  algebra:
    - "abbrev/^([a-z]).+$/$1/"
    - "abbrev/^([zcs]h).+$/$1/"
    - "derive/^([nl])ue$/$1ve/"
    - "derive/^([jqxy])u$/$1v/"
    - "derive/un$/uen/"
    - "derive/ui$/uei/"
    - "derive/iu$/iou/"
    - "derive/([aeiou])ng$/$1gn/"
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "西文"]
  - name: emoji
    reset: 1
    states: [Emoji, Emoji]
translator:
  dictionary: weike_pinyin
  enable_completion: true
  enable_encoder: true
  enable_sentence: true
  enable_user_dict: true
  initial_quality: 1.2
  max_phrase_length: 8